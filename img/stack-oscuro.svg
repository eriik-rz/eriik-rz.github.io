<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 236" width="1200" height="236" role="img" aria-label="Stack: PHP, Laravel, APIs, React, JavaScript, HTML, CSS, PostgreSQL, MySQL, UX/UI, prototipado, Figma, Claude Code, agentes de IA, MCP, Git, GitLab, Linux"><style>.sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','Cascadia Code',Menlo,Consolas,monospace}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes march{to{stroke-dashoffset:-44}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.tapa,.cur,.anim-solo{display:none}}.col{animation:up .6s cubic-bezier(.2,.8,.2,1) both}.eje{transform-box:fill-box;transform-origin:top;animation:baja .7s cubic-bezier(.2,.8,.2,1) both,pulso 3.5s ease-in-out infinite;animation-delay:inherit}@keyframes baja{from{transform:scaleY(0)}to{transform:none}}@keyframes pulso{0%,10%,100%{transform:none}5%{transform:scaleX(3)}}.c0{animation-delay:0.10s}.c1{animation-delay:0.25s}.c2{animation-delay:0.40s}.c3{animation-delay:0.55s}.c4{animation-delay:0.70s}.c5{animation-delay:0.85s}</style><rect width="1200" height="236" rx="18" fill="#0F1115"/><rect x="0.5" y="0.5" width="1199" height="235" rx="18" fill="none" stroke="#262B36"/><text x="40" y="48" class="mono" font-size="16" fill="#9AA2B1" letter-spacing="1.5">STACK</text><g class="col c0"><rect x="40" y="72" width="2" height="134" class="eje" fill="#262B36"/><text x="56" y="94" class="mono" font-size="16" fill="#9AA2B1">BACKEND</text><text x="56" y="132" class="sans" font-size="23" font-weight="600" fill="#F4F1EC">PHP</text><text x="56" y="166" class="sans" font-size="23" font-weight="600" fill="#F4F1EC">Laravel</text><text x="56" y="200" class="sans" font-size="23" font-weight="600" fill="#F4F1EC">APIs</text></g><g class="col c1"><rect x="230" y="72" width="2" height="134" class="eje" fill="#262B36"/><text x="246" y="94" class="mono" font-size="16" fill="#