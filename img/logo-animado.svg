<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><style>
/* Logo animado de eriik_rz.dev (2026-11-28): respira, el cursor parpadea y cada 7 s guiña el ojo. */
.cara{animation:respira 5s ease-in-out infinite}
.cursor{transform-box:fill-box;transform-origin:50% 50%;animation:guino 7s ease-in-out infinite}
.cursor-luz{animation:parpadeo 1.4s steps(1) infinite}
.sonrisa{transform-box:fill-box;transform-origin:50% 0%;animation:sonrie 7s ease-in-out infinite}
@keyframes respira{0%,100%{transform:translateY(0)}50%{transform:translateY(-0.8px)}}
@keyframes guino{0%,88%,100%{transform:scaleY(1)}90%,92%{transform:scaleY(.12)}94%{transform:scaleY(1)}}
@keyframes parpadeo{0%{opacity:1}55%{opacity:.55}}
@keyframes sonrie{0%,87%,97%,100%{transform:scale(1)}90%,93%{transform:scale(1.08,1.15)}}
@media (prefers-reduced-motion:reduce){.cara,.cursor,.cursor-luz,.sonrisa{animation:none}}
